<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪宝的一天 · 像素闯关</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --px-font: 'Press Start 2P', 'Zpix', 'SimHei', 'Microsoft YaHei', 'PingFang SC', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #16182b;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: var(--px-font);
    image-rendering: pixelated;
    padding: 12px;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 480px;
    width: 100%;
  }

  /* ---------- HUD ---------- */
  #hud {
    width: 100%;
    background: #1f2440;
    border: 3px solid #3d4470;
    box-shadow: 0 4px 0 #0c0e1c;
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    flex-wrap: wrap;
  }
  .avatar {
    width: 40px; height: 40px;
    background: #9ad0f0;
    border: 3px solid #3d4470;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15);
  }
  .name { font-size: 14px; letter-spacing: 2px; color: #ffe9a8; }
  .stat {
    margin-left: auto;
    font-size: 12px;
    background: #13162b;
    border: 2px solid #3d4470;
    border-radius: 4px;
    padding: 5px 8px;
    white-space: nowrap;
  }
  .stat.hp { color: #ff7b8a; }
  .stat.exp { color: #ffd54d; }
  .stat b { font-weight: bold; }
  .stat.flash { animation: flash .5s ease; }
  @keyframes flash {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  /* ---------- 游戏画布 ---------- */
  #stage {
    position: relative;
    width: 100%;
    border: 4px solid #3d4470;
    border-radius: 6px;
    box-shadow: 0 6px 0 #0c0e1c, 0 0 0 2px #000;
    overflow: hidden;
    background: #000;
    line-height: 0;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ---------- 剧情文字 ---------- */
  #story {
    position: absolute;
    top: 8px; left: 8px; right: 8px;
    background: rgba(12,14,28,0.78);
    border: 2px solid #3d4470;
    border-radius: 4px;
    color: #fff;
    font-size: 12px;
    line-height: 1.7;
    padding: 8px 10px;
    letter-spacing: 1px;
    pointer-events: none;
    transition: opacity .4s;
    text-align: center;
  }
  #story.hidden { opacity: 0; }

  /* ---------- 飘字 ---------- */
  .float {
    position: absolute;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 2px 2px 0 #000;
    animation: floatUp 1.5s ease-out forwards;
    z-index: 5;
  }
  @keyframes floatUp {
    0% { transform: translate(-50%, 0); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(-50%, -46px); opacity: 0; }
  }

  /* ---------- 选项按钮 ---------- */
  #choices {
    position: absolute;
    left: 8px; right: 8px; bottom: 8px;
    display: flex;
    gap: 8px;
    z-index: 6;
  }
  #choices.hidden { display: none; }
  .btn {
    flex: 1;
    font-family: var(--px-font);
    background: #fff;
    border: 3px solid #3d4470;
    border-radius: 6px;
    box-shadow: 0 4px 0 #0c0e1c;
    padding: 10px 8px;
    cursor: pointer;
    color: #1a1c33;
    text-align: center;
    transition: transform .06s, box-shadow .06s;
  }
  .btn .t { font-size: 12px; line-height: 1.5; letter-spacing: 1px; }
  .btn .d { font-size: 10px; color: #6b7199; margin-top: 5px; line-height: 1.4; }
  .btn:hover { background: #fff7e0; }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #0c0e1c; }

  /* ---------- 覆盖层（标题/结算） ---------- */
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,12,26,0.85);
    z-index: 10;
    text-align: center;
    padding: 16px;
    gap: 14px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    color: #ffe9a8;
    font-size: 22px;
    letter-spacing: 3px;
    text-shadow: 3px 3px 0 #7a3b2e;
    line-height: 1.4;
  }
  #overlay .sub { color: #c7cbe8; font-size: 11px; line-height: 1.8; letter-spacing: 1px; }
  #overlay .big {
    color: #fff;
    font-size: 20px;
    letter-spacing: 2px;
    line-height: 1.6;
  }
  #overlay .res-hp { color: #ff7b8a; }
  #overlay .res-exp { color: #ffd54d; }
  #overlay .win { color: #7ee07e; }
  #overlay .lose { color: #ff7b8a; }
  .btn.big {
    padding: 12px 22px;
    font-size: 14px;
    letter-spacing: 2px;
    min-width: 160px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <span class="avatar">⛄</span>
      <span class="name">雪宝</span>
      <span class="stat hp">❤ <b id="hpVal">100</b>/100</span>
      <span class="stat exp">★ <b id="expVal">50</b></span>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="story" class="hidden"></div>
      <div id="choices" class="hidden"></div>
      <div id="overlay">
        <h1>雪宝的一天</h1>
        <div class="sub">
          清晨 7 点，雪宝从床上爬起来。<br>
          沿着这条小马路往上走，穿过他一整天。<br>
          有些路口要选一选，选错了也没关系。
        </div>
        <button class="btn big" id="startBtn">开始游戏</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---------- 常量 ----------
  const W = 160, H = 240;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;

  const hpEl = document.getElementById('hpVal');
  const expEl = document.getElementById('expVal');
  const storyEl = document.getElementById('story');
  const choicesEl = document.getElementById('choices');
  const overlayEl = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  // ---------- 关卡数据 ----------
  // base：该关无选项时的基础数值；choice：二选一（与 base 叠加结算）
  // 数值平衡说明：原规则里经验值唯一来源是第3、5关“上课”各 +5，上限 +10，
  // 初始 50 顶多到 60，永远无法满足“经验 > 60”的判定，是死局。
  // 因此第4关剧情关补充了“经验 +5”，让全勤上课的路线能到 65 通关。
  // 想改数值，直接改这里即可。
  const LEVELS = [
    { time: '7:00 AM', scene: 'wake',  story: '闹钟响了。雪宝努力把自己从床上“铲”起来。', choice: null,
      base: { hp: -2, exp: 0 } },
    { time: '7:30 AM', scene: 'feed',  story: '小猫在脚边打滚，公交的喇叭已经在远处响了。', choice: [
        { text: '多撸一会儿猫', hp: +2, exp: -5, d: '❤+2 ★-5 · 猫咪呼噜呼噜' },
        { text: '说再见，赶公交', hp: -2, exp: 0, d: '❤-2 · 准时上车，有点舍不得' } ],
      base: { hp: +2, exp: 0 } },
    { time: '8:00 AM', scene: 'class', story: '黑板上的公式像雪花一样密密麻麻。', choice: [
        { text: '逃课', hp: -2, exp: -5, d: '❤-2 ★-5' },
        { text: '上课', hp: -5, exp: +5, d: '❤-5 ★+5' } ] },
    { time: '12:00 中午', scene: 'burger', story: '下课了！汉堡的香气和猫咪的呼噜，是中午的奖励。', choice: null,
      base: { hp: +2, exp: +5 } },
    { time: '14:00', scene: 'class', story: '下午的课，眼皮和黑板在拔河。', choice: [
        { text: '逃课撸猫', hp: -2, exp: -5, d: '❤-2 ★-5' },
        { text: '上课', hp: -5, exp: +5, d: '❤-5 ★+5' } ] },
    { time: '18:00', scene: 'dismiss', story: '下课铃，是全天最动听的音乐。', choice: null,
      base: { hp: -5, exp: 0 } },
    { time: '19:00', scene: 'dinner', story: '晚饭时间，吃什么好呢？', choice: [
        { text: '蛋糕', hp: +5, exp: 0, d: '❤+5 · 甜甜的' },
        { text: '面', hp: +5, exp: 0, d: '❤+5 · 热乎乎的' } ] },
    { time: '20:00', scene: 'novel', story: '小说比现实精彩一点点。', choice: [
        { text: '同人小说', hp: +10, exp: 0, d: '❤+10 · 心满意足' },
        { text: '霸道总裁爱上我', hp: +5, exp: 0, d: '❤+5 · 欲罢不能' } ] },
    { time: '00:00', scene: 'sleep', story: '一天结束，该睡了。', choice: [
        { text: '熬夜', hp: +5, exp: 0, d: '❤+5 · 再玩一会儿' },
        { text: '准时睡觉', hp: +10, exp: 0, d: '❤+10 · 早睡早起' } ] }
  ];

  // ---------- 天空配色（按关卡时间） ----------
  const SKY = [
    ['#8fd3f0', '#eaf6fb'],   // 7:00 清晨
    ['#9fd8ef', '#f0f8fc'],   // 7:30
    ['#8ecae6', '#e6f3fb'],   // 8:00
    ['#6ec6ff', '#eef7ff'],   // 12:00 中午
    ['#ffc98a', '#ffedcc'],   // 14:00 下午
    ['#ff9e64', '#ffd9b0'],   // 18:00 傍晚
    ['#3a4a7a', '#243154'],   // 19:00 晚
    ['#232f55', '#141b39'],   // 20:00
    ['#0c1330', '#040919']    // 00:00 深夜
  ];

  // ---------- 状态 ----------
  let state = 'title';       // title | playing | result
  let levelIndex = 0;
  let phase = 'arriving';    // arriving | cutscene | choosing | feedback
  let stats = { hp: 100, exp: 50 };
  let olafY = H - 40;        // 雪宝底部 y
  const ARRIVE_Y = 110;      // 到达点
  let phaseTimer = 0;
  let walkT = 0;
  let resultWin = false;
  let chosen = null;

  const CUTSCENE_DUR = 2.6;  // 剧情动画时长（秒）
  const FEEDBACK_DUR = 1.6;  // 反馈动画时长（秒）

  // ---------- 工具 ----------
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function mix(a, b, t) {
    const r = parseInt(a.slice(1,3),16), g = parseInt(a.slice(3,5),16), bl = parseInt(a.slice(5,7),16);
    const r2 = parseInt(b.slice(1,3),16), g2 = parseInt(b.slice(3,5),16), bl2 = parseInt(b.slice(5,7),16);
    const m = (x, y) => Math.round(x + (y - x) * t);
    return 'rgb(' + m(r,r2) + ',' + m(g,g2) + ',' + m(bl,bl2) + ')';
  }

  // ---------- 绘制：天空（像素渐变横条） ----------
  function drawSky() {
    const c = SKY[levelIndex];
    const steps = 12;
    for (let i = 0; i < steps; i++) {
      ctx.fillStyle = mix(c[0], c[1], i / (steps - 1));
      const y0 = Math.floor(i * H / steps);
      const y1 = Math.floor((i + 1) * H / steps);
      ctx.fillRect(0, y0, W, y1 - y0 + 1);
    }
    // 太阳/月亮
    const isNight = levelIndex >= 6;
    if (isNight) {
      ctx.fillStyle = '#f5f0d8';
      ctx.fillRect(118, 30, 8, 8);
      ctx.fillStyle = SKY[levelIndex][0];
      ctx.fillRect(112, 30, 4, 4);
    } else {
      ctx.fillStyle = '#fff2a8';
      ctx.fillRect(118, 26, 9, 9);
      ctx.fillRect(113, 26, 3, 3);
    }
  }

  // ---------- 绘制：地面（草坪 + 马路） ----------
  function drawGround() {
    // 草坪
    ctx.fillStyle = '#4c9e52';
    ctx.fillRect(0, 150, W, H - 150);
    ctx.fillStyle = '#3f8a45';
    for (let i = 0; i < 6; i++) {
      ctx.fillRect(i * 28, 152 + (i % 3) * 4, 12, 3);
    }
    // 马路
    ctx.fillStyle = '#6b6b76';
    ctx.fillRect(58, 0, 44, H);
    // 马路两侧边
    ctx.fillStyle = '#56565f';
    ctx.fillRect(56, 0, 2, H);
    ctx.fillRect(102, 0, 2, H);
    // 中央虚线
    ctx.fillStyle = '#e8e8ee';
    for (let y = 8; y < H; y += 18) {
      ctx.fillRect(78, y, 4, 8);
    }
  }

  // ---------- 绘制：树 ----------
  function drawTree(x, baseY, s) {
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(x - 1, baseY - 16 * s, 3, 16 * s);
    ctx.fillStyle = '#2f7d3a';
    ctx.fillRect(x - 6, baseY - 26 * s, 13, 11 * s);
    ctx.fillStyle = '#3f9850';
    ctx.fillRect(x - 4, baseY - 29 * s, 6, 4 * s);
  }

  // ---------- 绘制：长椅 ----------
  function drawBench(x, baseY) {
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(x, baseY - 10, 18, 4);
    ctx.fillRect(x, baseY - 6, 3, 6);
    ctx.fillRect(x + 15, baseY - 6, 3, 6);
    ctx.fillStyle = '#a1887f';
    ctx.fillRect(x + 1, baseY - 16, 16, 7);
  }

  // ---------- 绘制：公交 ----------
  function drawBus(x, y) {
    ctx.fillStyle = '#f4c542';
    ctx.fillRect(x, y, 34, 20);
    ctx.fillStyle = '#8fd3f0';
    ctx.fillRect(x + 3, y + 3, 8, 6);
    ctx.fillRect(x + 14, y + 3, 8, 6);
    ctx.fillRect(x + 25, y + 3, 6, 6);
    ctx.fillStyle = '#3a3a44';
    ctx.fillRect(x + 3, y + 20, 7, 6);
    ctx.fillRect(x + 24, y + 20, 7, 6);
  }

  // ---------- 绘制：猫 ----------
  function drawCat(x, y) {
    ctx.fillStyle = '#d9a066';
    ctx.fillRect(x - 5, y - 8, 10, 8);
    ctx.fillStyle = '#d9a066';
    ctx.fillRect(x - 4, y - 11, 3, 3);
    ctx.fillRect(x + 1, y - 11, 3, 3);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 3, y - 6, 1, 1);
    ctx.fillRect(x + 2, y - 6, 1, 1);
  }

  // ---------- 绘制：黑板 ----------
  function drawBoard(x, y) {
    ctx.fillStyle = '#2f3a2f';
    ctx.fillRect(x, y, 22, 14);
    ctx.fillStyle = '#3f4a3f';
    ctx.fillRect(x + 1, y + 1, 20, 12);
    ctx.fillStyle = '#eef';
    ctx.fillRect(x + 3, y + 4, 8, 1);
    ctx.fillRect(x + 3, y + 7, 12, 1);
    ctx.fillRect(x + 3, y + 10, 6, 1);
  }

  // ---------- 绘制：汉堡 ----------
  function drawBurger(x, y) {
    ctx.fillStyle = '#e8a84c';
    ctx.fillRect(x - 6, y - 4, 12, 4);
    ctx.fillStyle = '#7a4b2a';
    ctx.fillRect(x - 6, y, 12, 2);
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(x - 6, y + 2, 12, 2);
    ctx.fillStyle = '#e8a84c';
    ctx.fillRect(x - 6, y + 4, 12, 4);
  }

  // ---------- 绘制：蛋糕 ----------
  function drawCake(x, y) {
    ctx.fillStyle = '#f2a0b5';
    ctx.fillRect(x - 6, y - 6, 12, 10);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 6, y - 2, 12, 2);
    ctx.fillStyle = '#ffd54d';
    ctx.fillRect(x - 1, y - 9, 2, 3);
  }

  // ---------- 绘制：面 ----------
  function drawNoodle(x, y) {
    ctx.fillStyle = '#e8e0d0';
    ctx.fillRect(x - 8, y - 4, 16, 5);
    ctx.fillStyle = '#c9b8a0';
    ctx.fillRect(x - 7, y - 2, 14, 1);
  }

  // ---------- 绘制：书 ----------
  function drawBook(x, y) {
    ctx.fillStyle = '#5b8bd9';
    ctx.fillRect(x - 5, y - 7, 10, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 5, y - 7, 1, 8);
    ctx.fillRect(x - 4, y - 5, 7, 1);
  }

  // ---------- 绘制：床 ----------
  function drawBed(x, y) {
    ctx.fillStyle = '#8a6bb0';
    ctx.fillRect(x - 10, y - 5, 20, 6);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 10, y - 10, 20, 5);
    ctx.fillStyle = '#d9c8f0';
    ctx.fillRect(x + 6, y - 10, 4, 5);
  }

  // ---------- 绘制：雪宝 ----------
  function drawOlaf(x, y, opt) {
    opt = opt || {};
    const bob = opt.bob || 0;
    const lie = opt.lie || false;      // 睡觉关：躺下
    const shake = opt.shake || 0;      // 起床关：摇晃
    const nod = opt.nod || 0;          // 上课关：点头

    x += shake;
    const bodyY = y - bob;

    if (lie) {
      // 躺下的雪宝：一长条
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 12, bodyY - 9, 24, 10);
      ctx.fillStyle = '#dcecf5';
      ctx.fillRect(x - 12, bodyY - 4, 24, 5);
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(x - 4, bodyY - 8, 1, 1);
      ctx.fillRect(x + 2, bodyY - 8, 1, 1);
      ctx.fillStyle = '#ff8a3d';
      ctx.fillRect(x + 6, bodyY - 7, 3, 2);
      // zzz
      if (opt.zzz) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + 6, bodyY - 14, 2, 2);
        ctx.fillRect(x + 9, bodyY - 18, 2, 2);
        ctx.fillRect(x + 12, bodyY - 22, 2, 2);
      }
      return;
    }

    // 下球（身体）
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, bodyY - 9, 9, 0, Math.PI * 2);
    ctx.fill();
    // 身体阴影
    ctx.fillStyle = '#dcecf5';
    ctx.beginPath();
    ctx.arc(x, bodyY - 6, 8, Math.PI * 0.15, Math.PI * 0.85);
    ctx.fill();

    // 树枝手臂
    ctx.fillStyle = '#8a5a3a';
    ctx.fillRect(x - 13, bodyY - 13, 6, 2);
    ctx.fillRect(x - 14, bodyY - 15, 2, 3);
    ctx.fillRect(x + 7, bodyY - 13, 6, 2);
    ctx.fillRect(x + 12, bodyY - 15, 2, 3);

    // 上球（头）
    const headY = bodyY - 20 + nod;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, headY, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#dcecf5';
    ctx.beginPath();
    ctx.arc(x, headY + 2, 6, Math.PI * 0.15, Math.PI * 0.85);
    ctx.fill();

    // 眼睛
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 3, headY - 2, 2, 2);
    ctx.fillRect(x + 1, headY - 2, 2, 2);

    // 胡萝卜鼻子（向右上突出）
    ctx.fillStyle = '#ff8a3d';
    ctx.fillRect(x + 1, headY - 1, 2, 2);
    ctx.fillRect(x + 3, headY, 2, 2);
    ctx.fillRect(x + 5, headY + 1, 2, 2);

    // 微笑 + 大门牙
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x - 3, headY + 3, 6, 1);
    ctx.fillRect(x - 1, headY + 4, 3, 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 1, headY + 2, 3, 2);

    // 三根头发
    ctx.fillStyle = '#8a5a3a';
    ctx.fillRect(x - 3, headY - 9, 1, 3);
    ctx.fillRect(x, headY - 10, 1, 4);
    ctx.fillRect(x + 3, headY - 9, 1, 3);
  }

  // ---------- 绘制：场景道具 ----------
  function drawProps() {
    const sc = LEVELS[levelIndex].scene;
    if (sc === 'wake') {
      drawBed(42, 158);
      ctx.fillStyle = '#b0b7c8';
      ctx.fillRect(30, 120, 18, 12);   // 窗
    } else if (sc === 'feed') {
      drawCat(46, 158);
      ctx.fillStyle = '#c9a06a';
      ctx.fillRect(40, 150, 12, 8);    // 猫碗
      drawBus(118, 40);                 // 远处公交
    } else if (sc === 'class') {
      drawBoard(112, 56);
      ctx.fillStyle = '#8a6b4a';
      ctx.fillRect(38, 152, 14, 8);     // 课桌
    } else if (sc === 'burger') {
      drawBurger(44, 156);
      drawBus(118, 36);
    } else if (sc === 'dismiss') {
      drawTree(30, 168);
      drawBench(112, 168);
    } else if (sc === 'dinner') {
      drawCake(40, 160);
      drawNoodle(118, 160);
    } else if (sc === 'novel') {
      drawBook(44, 160);
      ctx.fillStyle = '#5b3a8a';
      ctx.fillRect(116, 148, 14, 12);   // 书堆
    } else if (sc === 'sleep') {
      ctx.fillStyle = '#0a0f28';
      ctx.fillRect(0, 150, W, H - 150);
      ctx.fillStyle = '#8a6bb0';
      ctx.fillRect(40, 150, 20, 12);    // 床
      ctx.fillStyle = '#fff';
      ctx.fillRect(42, 152, 16, 4);
      // 星星
      ctx.fillStyle = '#f5f0d8';
      ctx.fillRect(120, 70, 2, 2);
      ctx.fillRect(140, 100, 2, 2);
      ctx.fillRect(100, 130, 2, 2);
    }
  }

  // ---------- 渲染 ----------
  function render() {
    drawSky();
    drawGround();
    drawProps();

    // 雪宝动作参数
    let bob = 0, lie = false, shake = 0, nod = 0, zzz = false;
    const sc = LEVELS[levelIndex].scene;

    if (phase === 'arriving') {
      bob = Math.sin(walkT * 10) * 1.5;
    } else if (phase === 'cutscene') {
      if (sc === 'wake') { shake = Math.sin(walkT * 8) * 1.5; zzz = true; }
      else if (sc === 'sleep') { lie = true; zzz = true; }
      else if (sc === 'class') { nod = Math.sin(walkT * 8) * 2; }
      else if (sc === 'feed' || sc === 'burger' || sc === 'dinner' || sc === 'novel') { bob = Math.sin(walkT * 6) * 1; }
      else if (sc === 'dismiss') { bob = Math.abs(Math.sin(walkT * 8)) * 4; }
    } else if (phase === 'feedback') {
      bob = Math.sin(walkT * 12) * 2;
    }

    if (phase !== 'cutscene' && phase !== 'feedback') {
      drawOlaf(80, olafY, { bob, lie, shake, nod, zzz });
    } else {
      drawOlaf(80, olafY, { bob, lie, shake, nod, zzz });
    }
  }

  // ---------- HUD 刷新 ----------
  function refreshHud(flash) {
    hpEl.textContent = stats.hp;
    expEl.textContent = stats.exp;
    if (flash) {
      hpEl.parentElement.classList.remove('flash');
      expEl.parentElement.classList.remove('flash');
      void hpEl.parentElement.offsetWidth;
      void expEl.parentElement.offsetWidth;
      hpEl.parentElement.classList.add('flash');
      expEl.parentElement.classList.add('flash');
    }
  }

  // ---------- 数值应用 + 飘字 ----------
  function applyStats(base, choice) {
    let dhp = (base ? base.hp : 0) + (choice ? choice.hp : 0);
    let dexp = (base ? base.exp : 0) + (choice ? choice.exp : 0);
    stats.hp = clamp(stats.hp + dhp, 0, 100);
    stats.exp = Math.max(0, stats.exp + dexp);
    refreshHud(true);
    spawnFloat(dhp, dexp);
  }

  function spawnFloat(dhp, dexp) {
    const stage = document.getElementById('stage');
    const mk = (text, color, left) => {
      const el = document.createElement('div');
      el.className = 'float';
      el.textContent = text;
      el.style.color = color;
      el.style.left = left;
      el.style.top = '38%';
      stage.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    };
    const l = (dhp < 0) ? '20%' : '20%';
    const r = '72%';
    if (dhp !== 0) mk((dhp > 0 ? '+' : '') + dhp + ' ❤', '#ff7b8a', l);
    if (dexp !== 0) mk((dexp > 0 ? '+' : '') + dexp + ' ★', '#ffd54d', r);
  }

  // ---------- 选项按钮 ----------
  function showChoices() {
    const lv = LEVELS[levelIndex];
    choicesEl.innerHTML = '';
    lv.choice.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'btn';
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = c.text;
      const d = document.createElement('div');
      d.className = 'd';
      d.textContent = c.d;
      b.appendChild(t);
      b.appendChild(d);
      b.addEventListener('click', () => choose(c));
      choicesEl.appendChild(b);
    });
    choicesEl.classList.remove('hidden');
  }
  function hideChoices() { choicesEl.classList.add('hidden'); }

  function choose(c) {
    if (phase !== 'choosing') return;
    chosen = c;
    hideChoices();
    applyStats(LEVELS[levelIndex].base, c);
    phase = 'feedback';
    phaseTimer = FEEDBACK_DUR;
  }

  // ---------- 剧情文字 ----------
  function showStory(text) {
    storyEl.textContent = LEVELS[levelIndex].time + '　' + text;
    storyEl.classList.remove('hidden');
  }
  function hideStory() { storyEl.classList.add('hidden'); }

  // ---------- 进入关卡 ----------
  function enterLevel(i) {
    levelIndex = i;
    olafY = H - 40;
    phase = 'arriving';
    phaseTimer = 0;
    chosen = null;
    hideChoices();
    showStory(LEVELS[i].story);
  }

  function nextLevel() {
    if (levelIndex >= LEVELS.length - 1) {
      finish();
    } else {
      enterLevel(levelIndex + 1);
    }
  }

  // ---------- 结算 ----------
  function finish() {
    state = 'result';
    hideChoices();
    hideStory();
    resultWin = (stats.hp > 80 && stats.exp > 60);
    overlayEl.classList.remove('hidden');
    overlayEl.innerHTML =
      '<h1>' + (resultWin ? '闯关成功！' : '闯关失败') + '</h1>' +
      '<div class="big">' +
      '<div class="res-hp">❤ 生命值 ' + stats.hp + ' / 100</div>' +
      '<div class="res-exp">★ 经验值 ' + stats.exp + '</div>' +
      '</div>' +
      '<div class="sub">' +
      (resultWin
        ? '生命值 > 80 且 经验值 > 60，雪宝度过了完美的一天。'
        : '需要 生命值 > 80 且 经验值 > 60 才能过关。<br>多上上课，别只顾着撸猫哦。') +
      '</div>' +
      '<button class="btn big" id="restartBtn">' + (resultWin ? '再玩一次' : '重新开始') + '</button>';
    document.getElementById('restartBtn').addEventListener('click', restart);
  }

  function restart() {
    stats = { hp: 100, exp: 50 };
    refreshHud(false);
    state = 'playing';
    overlayEl.classList.add('hidden');
    enterLevel(0);
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    if (state === 'playing') {
      walkT += dt;
      if (phase === 'arriving') {
        olafY += (ARRIVE_Y - olafY) * Math.min(1, dt * 3.2);
        if (Math.abs(olafY - ARRIVE_Y) < 0.5) {
          olafY = ARRIVE_Y;
          phase = 'cutscene';
          phaseTimer = CUTSCENE_DUR;
        }
      } else if (phase === 'cutscene') {
        phaseTimer -= dt;
        if (phaseTimer <= 0) {
          const lv = LEVELS[levelIndex];
          if (lv.choice) {
            phase = 'choosing';
            showChoices();
          } else {
            applyStats(lv.base, null);
            phase = 'feedback';
            phaseTimer = FEEDBACK_DUR;
          }
        }
      } else if (phase === 'feedback') {
        phaseTimer -= dt;
        if (phaseTimer <= 0) {
          nextLevel();
        }
      }
    }

    render();
    requestAnimationFrame(loop);
  }

  // ---------- 启动 ----------
  startBtn.addEventListener('click', () => {
    state = 'playing';
    overlayEl.classList.add('hidden');
    refreshHud(false);
    enterLevel(0);
  });

  refreshHud(false);
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
